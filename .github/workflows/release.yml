name: release

# Publica a release e liga o auto-update SEM você rodar dist:publish na mão.
# Dispara quando o package.json muda no main (ou seja: você bumpa a versão e
# commita). Se a versão já tiver release publicada, o job pula — não duplica.
# Também dá pra rodar na mão pelo botão "Run workflow" na aba Actions.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # o GITHUB_TOKEN precisa disso pra criar release + tag
    env:
      # O next build não conecta no banco (rotas são force-dynamic), mas o
      # Prisma quer a var presente. Dummy — não existe arquivo, não precisa.
      DATABASE_URL: 'file:./ci.db'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ler versão do package.json
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: A release desta versão já existe?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.v }} já existe — pulando."
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v${{ steps.ver.outputs.v }} não existe — vai publicar."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      # Prepara a tag E a release ANTES do electron-builder rodar. Dois motivos:
      #  1) Com releaseType "release" o electron-builder cria a release já publicada
      #     (draft=false); o GitHub recusa (422 "Published releases must have a valid
      #     tag") se a tag ainda não for um ref git — quebrou a 0.4.2.
      #  2) Se a release NÃO existir, o electron-builder sobe os assets em paralelo e
      #     CADA upload dispara um "create release" — a corrida cria DUAS releases na
      #     mesma tag (uma com o .exe/latest.yml, outra com o blockmap), e o download
      #     por tag passa a dar 404. Quebrou a 0.4.3.
      # Pré-criando a release vazia aqui, o electron-builder ACHA ela e só anexa os
      # assets (sem criar nada) — publica tudo numa release só.
      - name: Preparar tag + release vazia (evita 422 e a corrida de criação)
        if: steps.check.outputs.existe == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.ver.outputs.v }}"
          if ! git ls-remote --tags origin "refs/tags/$V" | grep -q "refs/tags/$V"; then
            git tag "$V"
            git push origin "$V"
            echo "Tag $V criada e empurrada."
          fi
          if ! gh release view "$V" >/dev/null 2>&1; then
            gh release create "$V" --title "$V" --notes "Torre $V" --target main
            echo "Release $V criada (vazia) — o electron-builder anexa os assets."
          fi

      - name: Instalar dependências
        if: steps.check.outputs.existe == 'false'
        run: npm ci

      - name: Build + publicar (electron-builder)
        if: steps.check.outputs.existe == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish
