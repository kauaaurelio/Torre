<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Torre — finder pattern do QR do pareamento, âmbar de sinal sobre grafite.
       O único artefato que só existe nesta rota vira a marca. -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#131110"/>

  <!-- finder pattern (canto de QR): anel externo + miolo cheio, âmbar -->
  <!-- anel externo -->
  <rect x="44" y="44" width="140" height="140" rx="14" fill="#E9A13B"/>
  <rect x="70" y="70" width="88" height="88" rx="8" fill="#131110"/>
  <rect x="90" y="90" width="48" height="48" rx="6" fill="#E9A13B"/>

  <!-- a fita saindo do finder: módulo em voo (âmbar) + entregue (fósforo) -->
  <rect x="176" y="176" width="36" height="36" rx="7" fill="#E9A13B"/>
  <rect x="180" y="128" width="28" height="28" rx="6" fill="#6FBF73"/>
</svg>
